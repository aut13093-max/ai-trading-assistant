<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Trading Assistant</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:#e5edf8;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#121d32;border-bottom:1px solid #293852}
h1{margin:0;font-size:23px;color:#63d6b4}
header p,.small,.status{color:#a8b8ce;font-size:13px;line-height:1.6}
main{max-width:760px;margin:auto;padding:16px}
.card{background:#121d32;border:1px solid #293852;border-radius:14px;padding:17px;margin-bottom:15px}
h2{font-size:17px;margin:0 0 16px}
label{display:block;color:#afc0d5;font-size:13px;margin:12px 0 6px}
input,select{width:100%;padding:12px;background:#0b1120;border:1px solid #354764;border-radius:8px;color:white;font-size:15px}
button{width:100%;padding:13px;border:0;border-radius:9px;background:#32c99b;color:#06251c;font-weight:bold;font-size:15px;margin-top:12px}
button:disabled{opacity:.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.price{font-size:28px;font-weight:bold;color:#63d6b4;margin:10px 0}
.result{white-space:pre-wrap;line-height:1.8;font-size:14px;overflow-wrap:anywhere}
.good{color:#63d6b4}.warn{color:#ffcb78}
@media(max-width:480px){.grid{grid-template-columns:1fr}main{padding:10px}}
</style>
</head>
<body>
<header>
<h1>AI Trading Assistant</h1>
<p>外汇与黄金行情 · Gemini AI 分析 · 风险管理</p>
</header>
<main>
<section class="card">
<h2>实时行情</h2>
<label for="symbol">交易品种</label>
<select id="symbol">
<option>EUR/USD</option>
<option>USD/JPY</option>
<option>GBP/USD</option>
<option>XAU/USD</option>
</select>
<div class="price" id="priceDisplay">等待获取行情</div>
<div class="status" id="marketStatus">尚未获取价格</div>
<button id="fetchBtn" onclick="loadPrice()">获取最新价格</button>
<p class="small">行情来源：Twelve Data。数据可用性取决于服务商权限与额度。</p>
</section>

<section class="card">
<h2>Gemini AI 交易分析</h2>
<label for="trend">市场方向</label>
<select id="trend">
<option>上涨趋势</option>
<option>下跌趋势</option>
<option>横盘震荡</option>
<option>不确定</option>
</select>
<label for="structure">市场结构</label>
<select id="structure">
<option>趋势回调</option>
<option>突破关键位</option>
<option>区间内运行</option>
<option>结构不清晰</option>
</select>
<button id="analyzeBtn" onclick="analyze()">调用 Gemini AI 分析</button>
<div id="analysisResult" class="result" style="margin-top:14px">请先获取行情，再进行分析。</div>
<p class="small">AI 使用当前价格及你选择的方向和结构，不会自动读取K线或新闻，也不会自动下单。AI分析不保证盈利。</p>
</section>

<section class="card">
<h2>风险计算器</h2>
<div class="grid">
<div><label for="account">账户资金（USD）</label><input id="account" type="number" value="1000" min="0"></div>
<div><label for="risk">单笔风险（%）</label><input id="risk" type="number" value="1" min="0.1" max="100" step="0.1"></div>
<div><label for="entry">入场价格</label><input id="entry" type="number" step="any" placeholder="入场价格"></div>
<div><label for="stop">止损价格</label><input id="stop" type="number" step="any" placeholder="止损价格"></div>
<div><label for="target">止盈价格</label><input id="target" type="number" step="any" placeholder="止盈价格"></div>
</div>
<button onclick="calculateRisk()">计算风险与盈亏比</button>
<div id="riskResult" class="result" style="margin-top:14px">填写价格后计算。</div>
<p class="small">估算风险金额和盈亏比，不等同于实际手数计算。点值和合约规格取决于经纪商。</p>
</section>
</main>

<script>
let latestPrice=null;

async function readResponse(response){
  const text=await response.text();
  let data;
  try{data=JSON.parse(text)}
  catch{
    throw new Error("服务器没有返回JSON。请检查Vercel部署和API运行日志。");
  }
  if(!response.ok) throw new Error(data.error||("服务器错误："+response.status));
  return data;
}

async function loadPrice(){
  const btn=document.getElementById("fetchBtn");
  const status=document.getElementById("marketStatus");
  const display=document.getElementById("priceDisplay");
  btn.disabled=true;
  btn.textContent="正在获取...";
  status.textContent="正在连接行情接口...";
  try{
    const response=await fetch("/api/market?symbol="+encodeURIComponent(document.getElementById("symbol").value));
    const data=await readResponse(response);
    if(typeof data.price!=="number") throw new Error("行情价格无效");
    latestPrice=data.price;
    display.textContent=data.price.toLocaleString("en-US",{maximumFractionDigits:5});
    document.getElementById("entry").value=data.price;
    status.textContent="来源："+data.source+" · 更新时间："+new Date(data.timestamp).toLocaleString();
    status.className="status good";
  }catch(e){
    status.textContent="获取失败："+e.message;
    status.className="status warn";
  }finally{
    btn.disabled=false;
    btn.textContent="获取最新价格";
  }
}

function ruleAnalysis(symbol,price,trend,structure){
  let guidance="";
  if(trend==="上涨趋势"&&structure==="趋势回调"){
    guidance="观察回调是否在支撑区域止跌，并等待确认信号。";
  }else if(trend==="下跌趋势"&&structure==="趋势回调"){
    guidance="观察反弹是否在阻力区域受阻，并等待转弱确认。";
  }else if(structure==="突破关键位"){
    guidance="等待价格有效突破并确认，警惕假突破；不要追价入场。";
  }else if(structure==="区间内运行"||trend==="横盘震荡"){
    guidance="观察区间上下沿及突破确认，避免在区间中部盲目入场。";
  }else{
    guidance="当前方向或结构不明确，先等待更多价格行为确认。";
  }
  return "规则分析（备用模式）\n"+
    "品种："+symbol+"\n最新获取价格："+price+"\n"+
    "当前选择："+trend+" · "+structure+"\n"+
    "观察建议："+guidance+"\n"+
    "风险控制：先确定止损位置，再按账户风险计算仓位。\n"+
    "注意：规则分析不是AI模型输出，也不保证交易结果。";
}

async function analyze(){
  const btn=document.getElementById("analyzeBtn");
  const result=document.getElementById("analysisResult");
  if(latestPrice===null){
    result.textContent="请先点击“获取最新价格”。";
    return;
  }
  const symbol=document.getElementById("symbol").value;
  const trend=document.getElementById("trend").value;
  const structure=document.getElementById("structure").value;
  btn.disabled=true;
  btn.textContent="正在分析...";
  result.textContent="正在请求 Gemini AI...";
  try{
    const response=await fetch("/api/analyze",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({symbol,price:latestPrice,trend,structure})
    });
    const data=await readResponse(response);
    if(!data.analysis) throw new Error("AI没有返回分析内容");
    result.textContent=data.analysis;
  }catch(e){
    result.textContent="Gemini AI暂时不可用。\n原因："+e.message+
      "\n\n"+ruleAnalysis(symbol,latestPrice,trend,structure);
  }finally{
    btn.disabled=false;
    btn.textContent="调用 Gemini AI 分析";
  }
}

function calculateRisk(){
  const account=Number(document.getElementById("account").value);
  const riskPct=Number(document.getElementById("risk").value);
  const entry=Number(document.getElementById("entry").value);
  const stop=Number(document.getElementById("stop").value);
  const target=Number(document.getElementById("target").value);
  const result=document.getElementById("riskResult");
  if(!(account>0)||!(riskPct>0)||riskPct>100||!(entry>0)||!(stop>0)||!(target>0)){
    result.textContent="请填写有效的账户资金、风险比例、入场、止损和止盈价格。";
    return;
  }
  if(entry===stop){
    result.textContent="止损价格不能与入场价格相同。";
    return;
  }
  const riskDistance=Math.abs(entry-stop);
  const rewardDistance=Math.abs(target-entry);
  const rr=rewardDistance/riskDistance;
  const maxLoss=account*riskPct/100;
  const correctSide=(entry>stop&&target>entry)||(entry<stop&&target<entry);
  result.textContent=
    "计划最大亏损金额："+maxLoss.toFixed(2)+" USD\n"+
    "入场至止损距离："+riskDistance+"\n"+
    "入场至止盈距离："+rewardDistance+"\n"+
    "盈亏比：1 : "+rr.toFixed(2)+"\n"+
    "按该盈亏比估算的潜在盈利："+(maxLoss*rr).toFixed(2)+" USD\n"+
    (correctSide?"":"提醒：请检查止损和止盈是否符合交易方向。")+
    "\n实际风险还取决于手数、点值、点差和交易费用。";
}
</script>
</body>
</html>
